nav button:hover{color:#fff;border-color:var(--gold);box-shadow:0 0 12px -3px var(--gold)}

.k{color:#ff3df2}.s{color:#b6ff3c}.c{color:#5f6d99;font-style:italic}.t{color:#00f0ff}.f{color:#ffd23f}.n{color:#ff9f43}
.ill{display:flex;justify-content:center;margin:4px 0 14px}.ill svg{max-width:100%;height:auto}

footer a:focus-visible,nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

<script>
const MODULES = [
{id:"m1",title:"Modelo Relacional",src:"Aula 1",topics:[
["O modelo relacional","Proposto por Edgar F. Codd em 1970 (IBM), publicado em 'A Relational Model of Data for Large Shared Data Banks'. Organiza dados em relações (tabelas) com linhas e colunas, com base na álgebra relacional e teoria de conjuntos."],
["Componentes de uma tabela","Linhas (registros/tuplas) representam uma entidade única. Colunas (campos/atributos) descrevem uma característica. Cada coluna tem um tipo de dado (INT, VARCHAR, DECIMAL, DATE, BOOLEAN etc.)."],
["Entidade, atributo, registro","Entidade = objeto do mundo real (Cliente, Produto) → vira tabela. Atributo = propriedade da entidade (nome, e-mail) → vira coluna. Registro = instância concreta (um cliente específico) → vira linha."],
["Cardinalidade","1:1 (uma pessoa, um CPF), 1:N (um cliente, vários pedidos), N:N (alunos cursam várias disciplinas e vice-versa) — relação N:N exige tabela associativa."],
["Chaves PK e FK","PK (chave primária) identifica unicamente cada registro, não aceita nulo nem repetição. FK (chave estrangeira) referencia a PK de outra tabela, implementando o relacionamento e garantindo integridade referencial."]
]},
{id:"m2",title:"Modelagem Aplicada (DER)",src:"Aula 3",topics:[
["Do cenário ao DER","A modelagem parte das regras de negócio: atributos únicos (CPF, e-mail, SKU), status com domínio fechado (Agendada/Realizada/Cancelada) e cardinalidades entre entidades."],
["Relacionamento N:N → associativa","Quando duas entidades se relacionam em N:N (ex.: Pedido–Produto), é preciso uma tabela associativa (ItemPedido) que carregue os atributos próprios da relação, como quantidade e preço no momento da compra."],
["Duas associativas encadeadas","Em cenários mais ricos (Universidade), pode haver associativa sobre associativa: Matrícula (Aluno–Turma) e depois Nota (Matrícula–Avaliação), já que a nota depende dos dois."],
["Preço no momento da compra","Não se deve depender do preço atual do produto: o valor deve ser copiado para o item do pedido no instante da venda, preservando o histórico mesmo se o preço do produto mudar depois."],
["Restrições de negócio no modelo","Regras como 'não pode haver duas consultas no mesmo horário para o mesmo dentista' viram restrições/índices únicos compostos (ex.: UNIQUE em dentista_id + data_hora)."]
]},
{id:"m3",title:"DDL, DML e CRUD",src:"Aula 4",topics:[
["Três famílias de comandos","DDL (CREATE, ALTER, DROP) cria e altera a estrutura. DML (INSERT, UPDATE, DELETE) mexe nos dados. DQL (SELECT) faz perguntas aos dados. Frase-chave: 'DDL cria a casa, DML mexe nos móveis, DQL faz perguntas'."],
["Criando tabelas com constraints","CREATE TABLE define colunas e tipos, além de PRIMARY KEY, FOREIGN KEY, UNIQUE e CHECK (ex.: CHECK (salario >= 0), CHECK (status IN ('Ativo','Inativo')))."],
["CRUD básico","INSERT INTO insere linhas; SELECT consulta; UPDATE altera valores existentes com WHERE; DELETE remove linhas. Em RH real, prefere-se inativar (UPDATE status='Inativo') a deletar o registro do colaborador."],
["Evoluindo a estrutura (ALTER TABLE)","ALTER TABLE ... ADD coluna adiciona colunas novas; ALTER COLUMN muda tipo/tamanho; ADD CONSTRAINT cria UNIQUE ou DEFAULT depois da tabela já existir."],
["Modelo Mini RH","4 tabelas: Departamento e Cargo (catálogos), Colaborador (tabela principal, com FKs para os catálogos) e Falta (histórico 1:N ligado ao colaborador)."]
]},
{id:"m4",title:"Consultas e Agregações",src:"Aula 5",topics:[
["Consultas básicas","WHERE filtra linhas; ORDER BY ordena (ASC padrão, DESC decrescente); TOP n limita o resultado; DISTINCT remove duplicados."],
["Filtros essenciais","LIKE busca por padrão de texto ('%@empresa.com%'); IN testa uma lista de valores; BETWEEN define uma faixa; IS NULL testa ausência de valor."],
["Funções de agregação","COUNT conta linhas, SUM soma, AVG calcula média, MIN e MAX retornam extremos. Costumam vir combinadas com GROUP BY para relatórios por categoria."],
["GROUP BY e HAVING","GROUP BY agrupa linhas por uma coluna (ex.: id_departamento); HAVING filtra os grupos já agregados — é o 'WHERE das agregações' (WHERE não pode usar funções de agregação diretamente)."],
["Índices","Aceleram filtros e ordenações, mas têm custo em escrita (INSERT/UPDATE/DELETE). Índices compostos ajudam filtros com mais de uma coluna, como (status, id_departamento)."]
]},
{id:"m5",title:"JOIN, Subquery, CASE e Normalização",src:"Aula 6",topics:[
["JOIN","Conecta tabelas relacionadas via FK para relatórios completos, como Colaborador + Departamento + Cargo. Funciona bem quando o modelo já está normalizado em catálogos."],
["Subquery simples","Uma subconsulta no WHERE compara cada linha a um valor calculado, como a média geral de salários: WHERE salario > (SELECT AVG(salario) FROM ...)."],
["Subquery correlacionada","Referencia a tabela externa dentro da subquery (c2.id_departamento = c.id_departamento), recalculando o valor de comparação para cada linha — útil para 'acima da média do próprio departamento'."],
["CASE","Cria categorias diretamente no SELECT, traduzindo valores numéricos ou status em classificações de negócio (ex.: faixa salarial, nível de risco)."],
["Normalização (1FN, 2FN, 3FN)","1FN: valores atômicos, sem listas dentro de um campo (usar tabela associativa Colaborador_Habilidade). 2FN: em chave composta, todo atributo deve depender da chave toda. 3FN: evitar dependência transitiva — não duplicar nome_departamento em Colaborador, usar FK + JOIN."]
]}];

const QUESTIONS = [
{m:"m1",q:"Quem propôs o modelo relacional de bancos de dados, em 1970?",o:["Bill Gates","Edgar F. Codd","Larry Ellison","Donald Knuth"],c:1,e:"Edgar F. Codd publicou o artigo seminal sobre o modelo relacional enquanto trabalhava na IBM."},
{m:"m1",q:"Em uma tabela relacional, o que representa cada linha?",o:["Um atributo","Um tipo de dado","Um registro/entidade única","O nome da tabela"],c:2,e:"Cada linha (registro/tupla) representa uma instância única da entidade."},
{m:"m1",q:"Qual cardinalidade descreve 'um cliente faz vários pedidos'?",o:["1:1","1:N","N:N","0:0"],c:1,e:"Um cliente pode ter muitos pedidos, mas cada pedido pertence a um único cliente: 1:N."},
{m:"m1",q:"O que caracteriza uma chave primária (PK)?",o:["Pode repetir valores","Pode ser nula","Identifica unicamente cada registro","Sempre referencia outra tabela"],c:2,e:"A PK garante unicidade absoluta e não aceita valores nulos."},
{m:"m1",q:"Uma chave estrangeira (FK) serve para:",o:["Ordenar os registros","Referenciar a PK de outra tabela, criando o vínculo","Definir o tipo de dado da coluna","Substituir a PK"],c:1,e:"A FK implementa o relacionamento entre tabelas, garantindo integridade referencial."},
{m:"m2",q:"Quando duas entidades se relacionam em N:N, como Pedido e Produto, o que é necessário?",o:["Nada, basta uma FK simples","Uma tabela associativa (ex.: ItemPedido)","Duplicar os dados nas duas tabelas","Usar apenas uma chave primária composta sem tabela extra"],c:1,e:"Relações N:N exigem uma tabela associativa que carregue os atributos próprios da relação."},
{m:"m2",q:"Por que o 'preço no momento da compra' deve ficar salvo no item do pedido, e não ser buscado do produto?",o:["Para economizar espaço","Porque o preço do produto pode mudar depois e alteraria o histórico da venda","Porque o SQL exige isso","Não há motivo real"],c:1,e:"Salvar o preço no item preserva o valor histórico da venda, independente de alterações futuras no produto."},
{m:"m2",q:"No cenário da clínica odontológica, qual restrição evita duplicidade de horário para o mesmo dentista?",o:["PRIMARY KEY simples em id_consulta","Um índice/constraint único em (dentista_id, data_hora)","FOREIGN KEY em paciente_id","Nenhuma é necessária"],c:1,e:"Uma restrição única composta impede duas consultas no mesmo horário para o mesmo dentista."},
{m:"m2",q:"No cenário da universidade, qual par de entidades associativas aparece encadeado?",o:["Aluno–Professor e Turma–Disciplina","Matrícula (Aluno–Turma) e Nota (Matrícula–Avaliação)","Disciplina–Professor apenas","Aluno–Avaliação direto"],c:1,e:"Nota depende tanto da Matrícula quanto da Avaliação, formando uma associativa sobre outra associativa."},
{m:"m2",q:"Guardar 'nome_departamento' dentro da tabela Colaborador, duplicando o que já existe em Departamento, viola qual forma normal?",o:["1FN","2FN","3FN","Nenhuma"],c:2,e:"É uma dependência transitiva: o correto é manter id_departamento (FK) e buscar o nome via JOIN, respeitando a 3FN."},
{m:"m3",q:"Qual família de comandos SQL é usada para criar e alterar a estrutura das tabelas?",o:["DML","DQL","DDL","DCL"],c:2,e:"DDL (CREATE, ALTER, DROP) cria e modifica a estrutura — 'DDL cria a casa'."},
{m:"m3",q:"Qual comando pertence à DML?",o:["CREATE TABLE","SELECT","UPDATE","ALTER TABLE"],c:2,e:"UPDATE é DML (mexe nos dados); CREATE e ALTER são DDL; SELECT é DQL."},
{m:"m3",q:"A constraint CHECK (salario >= 0) serve para:",o:["Definir a chave primária","Garantir que a coluna nunca receba valor negativo","Criar um índice","Referenciar outra tabela"],c:1,e:"CHECK valida uma regra de domínio sobre os valores aceitos na coluna."},
{m:"m3",q:"Em um sistema de RH real, ao desligar um colaborador, qual é a prática recomendada?",o:["DELETE do registro imediatamente","UPDATE mudando status para 'Inativo'","Remover a tabela inteira","Criar uma nova tabela"],c:1,e:"Inativar preserva o histórico; DELETE é usado com cautela e evitado para colaboradores."},
{m:"m3",q:"Para adicionar uma nova coluna 'cpf' a uma tabela já existente, usa-se:",o:["CREATE TABLE ... ADD cpf","ALTER TABLE ... ADD cpf VARCHAR(14) NULL","INSERT INTO ... cpf","UPDATE ... ADD cpf"],c:1,e:"ALTER TABLE ADD é o comando DDL correto para acrescentar colunas a uma tabela existente."},
{m:"m4",q:"Qual cláusula limita a quantidade de linhas retornadas, por exemplo as 3 primeiras?",o:["LIMIT ROWS","TOP 3","MAX(3)","COUNT(3)"],c:1,e:"No T-SQL, TOP n (combinado a ORDER BY) retorna as n primeiras linhas do resultado ordenado."},
{m:"m4",q:"Qual operador testa se um valor está dentro de uma faixa, como salário entre 5000 e 9000?",o:["IN","LIKE","BETWEEN","IS NULL"],c:2,e:"BETWEEN 5000 AND 9000 define uma faixa de valores (inclusive)."},
{m:"m4",q:"Qual das opções é uma função de agregação?",o:["WHERE","ORDER BY","AVG","DISTINCT"],c:2,e:"AVG calcula a média; as demais não são funções de agregação."},
{m:"m4",q:"Qual cláusula filtra grupos já agregados, como departamentos com salário médio acima de 7000?",o:["WHERE","GROUP BY","HAVING","ORDER BY"],c:2,e:"HAVING filtra os grupos formados pelo GROUP BY — o WHERE não pode usar funções de agregação diretamente."},
{m:"m4",q:"Qual é o principal custo de se criar muitos índices em uma tabela?",o:["Deixa o SELECT mais lento sempre","Aumenta o custo de escrita (INSERT/UPDATE/DELETE)","Impede o uso de WHERE","Remove a necessidade de PK"],c:1,e:"Índices aceleram leitura, mas cada escrita precisa atualizar também os índices, encarecendo INSERT/UPDATE/DELETE."},
{m:"m5",q:"Para trazer Colaborador junto com o nome do Departamento e do Cargo, o comando adequado é:",o:["Duas subqueries separadas","JOIN com Departamento e com Cargo","GROUP BY departamento","CASE WHEN departamento"],c:1,e:"JOIN conecta as tabelas relacionadas via FK, trazendo os dados de contexto em uma única consulta."},
{m:"m5",q:"O que caracteriza uma subquery correlacionada?",o:["Ela nunca referencia a tabela externa","Ela referencia uma coluna da consulta externa, sendo recalculada por linha","Ela sempre retorna várias colunas","Ela substitui o JOIN em todos os casos"],c:1,e:"Na subquery correlacionada (ex.: c2.id_departamento = c.id_departamento), o valor de comparação é recalculado para cada linha da consulta externa."},
{m:"m5",q:"O comando CASE dentro do SELECT serve para:",o:["Criar uma nova tabela","Classificar/traduzir valores em categorias diretamente no resultado","Deletar registros condicionalmente","Substituir o JOIN"],c:1,e:"CASE permite criar colunas de classificação (ex.: faixa salarial) a partir de regras condicionais sobre os dados."},
{m:"m5",q:"Guardar habilidades como uma lista de texto em um único campo (ex.: 'Excel;PowerBI;Python') viola qual forma normal?",o:["1FN","2FN","3FN","Nenhuma"],c:0,e:"A 1FN exige valores atômicos; a solução é criar uma tabela Habilidade e uma tabela associativa Colaborador_Habilidade."},
{m:"m5",q:"Em uma tabela associativa com chave composta (id_colaborador, id_habilidade), colocar nome_colaborador nessa tabela violaria:",o:["1FN","2FN","3FN","Nenhuma forma normal"],c:1,e:"A 2FN exige que todo atributo dependa da chave composta inteira; nome_colaborador depende só de id_colaborador."}

const ESSAYS = [

const FLASH = [
["PK — Chave Primária","Identifica unicamente cada registro de uma tabela; não aceita nulos nem repetições."],
["FK — Chave Estrangeira","Coluna que referencia a PK de outra tabela, criando o relacionamento e garantindo integridade referencial."],
["DDL","Data Definition Language: CREATE, ALTER, DROP — define a estrutura do banco."],
["DML","Data Manipulation Language: INSERT, UPDATE, DELETE — manipula os dados."],
["DQL","Data Query Language: SELECT — consulta os dados."],
["Cardinalidade 1:N","Uma instância de A se relaciona com várias de B (ex.: um colaborador tem várias faltas)."],
["Tabela associativa","Tabela criada para resolver um relacionamento N:N, carregando FKs das duas entidades e atributos próprios da relação."],
["1FN","Todo atributo deve ter valor atômico — nada de listas dentro de um campo."],
["2FN","Em chave composta, todo atributo não-chave deve depender da chave inteira, não de parte dela."],
["3FN","Evitar dependência transitiva — não duplicar dados que já existem em outra tabela referenciada por FK."],
["JOIN","Combina linhas de duas ou mais tabelas relacionadas, geralmente via FK, em uma única consulta."],
["Subquery correlacionada","Subconsulta que referencia uma coluna da consulta externa, sendo recalculada para cada linha."],
["CASE","Expressão do SELECT que classifica/traduz valores em categorias de negócio."],
["GROUP BY","Agrupa linhas que compartilham valores em uma ou mais colunas, para uso com funções de agregação."],
["HAVING","Filtra grupos já formados pelo GROUP BY — o 'WHERE' das agregações."],
["Índice","Estrutura que acelera buscas/ordenações, com custo adicional em operações de escrita."],
["CHECK","Constraint que valida uma regra de domínio sobre os valores aceitos em uma coluna."]
];


const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(s){return esc(s).replace(/(--.*$)|('[^']*')|\b(CREATE|TABLE|PRIMARY|KEY|FOREIGN|REFERENCES|INSERT|INTO|VALUES|SELECT|FROM|WHERE|UPDATE|SET|ALTER|ADD|COLUMN|CONSTRAINT|UNIQUE|CHECK|IN|NOT|NULL|JOIN|ON|AS|GROUP|BY|HAVING|ORDER|DESC|DISTINCT|TOP|LIKE|BETWEEN|AND|IS|CASE|WHEN|THEN|ELSE|END|INDEX|IDENTITY)\b|\b(INT|VARCHAR|DECIMAL|DATE|CHAR|BIT)\b|\b(COUNT|SUM|AVG|MIN|MAX)\b|\b(\d+)\b/gm,(m,c,st,k,t,f,n)=>c?`<span class="c">${c}</span>`:st?`<span class="s">${st}</span>`:k?`<span class="k">${k}</span>`:t?`<span class="t">${t}</span>`:f?`<span class="f">${f}</span>`:`<span class="n">${n}</span>`)}

let state = {view:"mapa", quiz:null, sim:null, flashIdx:0, flashFlip:false};
function ls_get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function ls_set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const TABS = [["mapa","Mapa"],["estudar","Estudar"],["quiz","Quiz"],["simulado","Simulado"],["flashcards","Flashcards"],["progresso","Progresso"]];
function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([id,l])=>
    `<button class="${state.view===id?'active':''}" onclick="setView('${id}')">${l}</button>`).join("");
}
function setView(v){state.view=v; if(v!=="quiz")state.quiz=null; if(v!=="simulado")state.sim=null; renderNav(); render();}

function render(){
  const el = document.getElementById("view");
  if(state.view==="mapa") el.innerHTML = mapaHTML();
  else if(state.view==="estudar") el.innerHTML = estudarHTML(state.estudoMod);
  else if(state.view==="quiz") el.innerHTML = quizHTML();
  else if(state.view==="simulado") el.innerHTML = simHTML();
  else if(state.view==="flashcards") el.innerHTML = flashHTML();
  else if(state.view==="progresso") el.innerHTML = progHTML();
}

function mapaHTML(){
  return `<div class="hero"><div class="ill">${ER_SVG}</div><p>Exemplo do curso: um banco de RH com 4 tabelas e 3 relacionamentos 1:N. Escolha um módulo para estudar.</p></div><div class="grid">` + MODULES.map((m,i)=>
    `<div class="mcard" style="--c:${NEON[i]}" onclick="openModulo('${m.id}')"><span class="ico">${ICONS[i]}</span><span class="pill">${m.src}</span><h3>${m.title}</h3><span>${m.topics.length} tópicos com SQL</span></div>`
  ).join("") + `</div>`;
}
function openModulo(id){state.view="estudar";state.estudoMod=id;renderNav();render();window.scrollTo(0,0)}

function estudarHTML(modId){
  const mods = modId ? MODULES.filter(m=>m.id===modId) : MODULES;
  return mods.map(m=>`<div class="card" style="margin-bottom:16px"><span class="pill">${m.src}</span><h2 style="margin:4px 0 12px">${m.title}</h2><div class="ill">${ILLUS[m.id]}</div>` +
    m.topics.map((t,i)=>`<div class="topic"><h3>${t[0]}</h3><p>${t[1]}</p><pre class="sql"><code>${hl(SQL[m.id][i])}</code></pre></div>`).join("") + `</div>`).join("") +
    (modId? `<button class="btn ghost" onclick="state.estudoMod=null;render()">Ver todos os módulos</button>`:"");
}

function newAttempt(qs){return {qs, idx:0, answers:Array(qs.length).fill(null), started:Date.now()}}

function quizHTML(){
  if(!state.quiz) state.quiz = newAttempt(shuffle([...QUESTIONS.keys()]));
  return attemptHTML(state.quiz, "quiz", false);
}
function simHTML(){
  if(!state.sim){
    const mc = shuffle([...QUESTIONS.keys()]);
    state.sim = newAttempt(mc);
    state.sim.essayAns = Array(ESSAYS.length).fill("");
  }
  return attemptHTML(state.sim, "sim", true);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function attemptHTML(st, key, withEssay){
  if(st.done) return resultHTML(st, key, withEssay);
  const qi = st.qs[st.idx];
  const q = QUESTIONS[qi];
  const mod = MODULES.find(m=>m.id===q.m);
  const answered = st.answers[st.idx]!==null;
  const pct = Math.round((st.idx/st.qs.length)*100);
  return `<div class="card">
    <span class="pill">${mod.title}</span>
    <div class="progbar"><div style="width:${pct}%"></div></div>
    <p style="color:var(--muted);font-size:.8rem;margin:0 0 4px">Questão ${st.idx+1} de ${st.qs.length}</p>
    <h3 style="margin:0 0 16px">${q.q}</h3>
    ${q.o.map((op,i)=>`<button class="opt ${answered?(i===q.c?'correct':(i===st.answers[st.idx]?'wrong':'')):''}" ${answered?'disabled':''} onclick="answer('${key}',${i})">${op}</button>`).join("")}
    ${answered?`<div class="explain">${q.e}</div>`:""}
    <div class="row">
      ${answered?`<button class="btn" onclick="nextQ('${key}',${withEssay})">${st.idx+1<st.qs.length?'Próxima':(withEssay?'Ir para as dissertativas':'Ver resultado')}</button>`:""}
    </div>
  </div>`;
}
function answer(key,i){
  const st = key==="quiz"?state.quiz:state.sim;
  if(st.answers[st.idx]!==null) return;
  st.answers[st.idx]=i; render();
}
function nextQ(key,withEssay){
  const st = key==="quiz"?state.quiz:state.sim;
  if(st.idx+1<st.qs.length){st.idx++; render(); window.scrollTo(0,0); return}
  if(withEssay && !st.essayPhase){st.essayPhase=true; render(); window.scrollTo(0,0); return}
  st.done=true;
  const score = st.qs.reduce((s,qi,i)=> s + (st.answers[i]===QUESTIONS[qi].c?1:0), 0);
  const hist = ls_get("history",[]);
  hist.push({key, score, total: st.qs.length, date: new Date().toISOString()});
  ls_set("history", hist);
  render(); window.scrollTo(0,0);
}

function resultHTML(st, key, withEssay){
  if(withEssay && st.essayPhase && !st.essayShown){
    return `<div class="card"><h2 style="margin-top:0">Questões dissertativas</h2><p style="color:var(--muted)">Responda livremente e depois compare com o roteiro de correção.</p>` +
      ESSAYS.map((e,i)=>`<div class="topic"><h3>${MODULES.find(m=>m.id===e.m).title}</h3><p>${e.q}</p>
        <textarea placeholder="Sua resposta..." onchange="st_essay(${i},this.value)">${st.essayAns[i]}</textarea></div>`).join("") +
      `<div class="row"><button class="btn" onclick="finishEssay('${key}')">Finalizar simulado</button></div></div>`;
  }
  const score = st.qs.reduce((s,qi,i)=> s + (st.answers[i]===QUESTIONS[qi].c?1:0), 0);
  const pct = Math.round(score/st.qs.length*100);
  let html = `<div class="card"><h2 style="margin-top:0">Resultado</h2>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
      <div class="stat"><b>${score}/${st.qs.length}</b><span>Acertos</span></div>
      <div class="stat"><b>${pct}%</b><span>Aproveitamento</span></div>
      <div class="stat"><b>${pct>=70?'Bom':'Revisar'}</b><span>Sugestão</span></div>
    </div>
    <h3>Correção item a item</h3>` +
    st.qs.map((qi,i)=>{
      const q = QUESTIONS[qi]; const ok = st.answers[i]===q.c;
      return `<div class="topic"><h3 style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'Correto':'Incorreto'} — ${q.q}</h3>
        <p>Sua resposta: ${q.o[st.answers[i]]??'—'}${ok?'':' · Correta: '+q.o[q.c]}</p>
        <div class="explain">${q.e}</div></div>`;
    }).join("");
  if(withEssay){
    html += `<h3>Roteiro das dissertativas</h3>` + ESSAYS.map((e,i)=>
      `<div class="topic"><h3>${e.q}</h3><p><b>Sua resposta:</b> ${st.essayAns[i]||'(em branco)'}</p><div class="explain"><b>Sugestão de correção:</b> ${e.g}</div></div>`).join("");
  }
  const weak = [...new Set(st.qs.filter((qi,i)=>st.answers[i]!==QUESTIONS[qi].c).map(qi=>MODULES.find(m=>m.id===QUESTIONS[qi].m).title))];
  html += `<div class="explain" style="margin-top:16px"><b>Revisar:</b> ${weak.length? weak.join(", ") : "Nenhum ponto fraco — mandou bem!"}</div>
    <div class="row"><button class="btn" onclick="restart('${key}',${withEssay})">Tentar novamente</button></div></div>`;
  return html;
}
function st_essay(i,v){state.sim.essayAns[i]=v}
function finishEssay(key){state.sim.essayShown=true; nextQ(key,true)}
function restart(key,withEssay){ if(key==="quiz")state.quiz=null; else state.sim=null; render(); window.scrollTo(0,0)}

function flashHTML(){
  const f = FLASH[state.flashIdx];
  return `<div class="card">
    <p style="color:var(--muted);font-size:.85rem;margin:0 0 14px">Card ${state.flashIdx+1} de ${FLASH.length}</p>
    <div class="flash" onclick="flipCard()">${state.flashFlip? f[1] : f[0]}<small>${state.flashFlip? 'clique para ver o termo':'clique para ver a definição'}</small></div>
    <div class="row"><button class="btn ghost" onclick="stepCard(-1)">Anterior</button><button class="btn" onclick="stepCard(1)">Próximo</button></div>
  </div>`;
}
function flipCard(){state.flashFlip=!state.flashFlip; render()}
function stepCard(d){state.flashIdx=(state.flashIdx+d+FLASH.length)%FLASH.length; state.flashFlip=false; render()}

function progHTML(){
  const hist = ls_get("history",[]);
  if(!hist.length) return `<div class="card"><h2 style="margin-top:0">Progresso</h2><p style="color:var(--muted)">Ainda sem tentativas registradas. Faça um Quiz ou Simulado para começar a acompanhar sua evolução.</p></div>`;
  const avg = Math.round(hist.reduce((s,h)=>s+h.score/h.total,0)/hist.length*100);
  const best = Math.round(Math.max(...hist.map(h=>h.score/h.total))*100);
  return `<div class="card"><h2 style="margin-top:0">Progresso</h2>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
      <div class="stat"><b>${hist.length}</b><span>Tentativas</span></div>
      <div class="stat"><b>${avg}%</b><span>Média geral</span></div>
      <div class="stat"><b>${best}%</b><span>Melhor resultado</span></div>
    </div>
    <h3>Histórico</h3>` +
    hist.slice().reverse().map(h=>`<div class="topic"><h3>${h.key==='sim'?'Simulado':'Quiz'} — ${Math.round(h.score/h.total*100)}%</h3><p>${h.score}/${h.total} acertos · ${new Date(h.date).toLocaleString('pt-BR')}</p></div>`).join("") +
    `</div>`;
}

renderNav(); render();
</script>
</body>
</html>
